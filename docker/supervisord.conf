; Runs the whole My Mate stack in one container. Postgres + Redis live elsewhere.
; Every program logs to the container's stdout/stderr so `docker logs` just works.
;
; Restart policy: autorestart=true alone gives up after 3 fast failures (startretries default)
; and leaves the program FATAL for the life of the container, eg if Postgres or Redis is still
; coming up when we start. startsecs=10 + startretries=1000 keeps retrying with supervisor's
; growing backoff (1s, 2s, 3s ...) instead. See deploy/supervisor/mymate.conf for the detail.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
startsecs=10
startretries=1000
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autorestart=true
startsecs=10
startretries=1000
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rusted]
command=/usr/local/bin/rusted --config /etc/rusted/config.toml serve
user=www-data
autorestart=true
startsecs=10
startretries=1000
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8080
user=www-data
autorestart=true
startsecs=10
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php /app/artisan horizon
user=www-data
autorestart=true
startsecs=10
startretries=1000
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:loop]
command=php /app/artisan mymate:loop
user=www-data
autorestart=true
startsecs=10
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
autorestart=true
startsecs=10
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent-hub]
command=php /app/artisan mymate:agent-hub --host=127.0.0.1 --port=9091
user=www-data
autorestart=true
startsecs=10
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
