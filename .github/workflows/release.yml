name: Release

# Tag a version (e.g. v1.0.0) to build the .deb + the Proxmox LXC template and publish
# them as a GitHub Release. The .deb is the reliable artifact; the LXC build needs a
# systemd-capable container (podman --privileged --systemd) - it works on GitHub-hosted
# runners in most cases, but if it fails, use a self-hosted runner for that job.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, snmp, mbstring, xml, curl, bcmath, gd, zip, intl, sodium
          tools: composer
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build the Rusted backup engine (bundled so backups work out of the box)
        continue-on-error: true   # optional - the .deb still installs (backups just unconfigured)
        run: bash deploy/rusted/build-rusted.sh
      - name: Build the .deb
        run: VERSION="${GITHUB_REF_NAME#v}" deploy/build/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: mymate-deb, path: dist/*.deb, if-no-files-found: error }

  build-lxc:
    name: Build Proxmox LXC template
    runs-on: ubuntu-24.04
    continue-on-error: true   # best-effort; the .deb release does not depend on it
    # The podman --systemd LXC build occasionally hangs on a hosted runner. Without a cap it
    # sits at GitHub's 6-hour job limit and holds the Publish job (which needs it) hostage that
    # whole time. Fail it fast instead: continue-on-error means Publish then ships the .deb +
    # agents straight away, and a stale LXC asset from the prior build is kept.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, snmp, mbstring, xml, curl, bcmath, gd, zip, intl, sodium
          tools: composer
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build the Rusted backup engine (bundled so backups work out of the box)
        continue-on-error: true
        run: bash deploy/rusted/build-rusted.sh
      - name: Install container tooling
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends podman zstd nftables passt
      - name: Build the .deb (input to the template)
        run: VERSION="${GITHUB_REF_NAME#v}" deploy/build/build-deb.sh
      - name: Build the LXC template
        run: VERSION="${GITHUB_REF_NAME#v}" deploy/build/build-lxc.sh
      - uses: actions/upload-artifact@v4
        with: { name: mymate-lxc, path: dist/*.tar.zst, if-no-files-found: warn }

  agent:
    name: Build agent binaries (amd64/arm64/arm - linux/macOS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - name: Cross-compile + package archives
        working-directory: agent
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh
      - name: Package the agent as .deb (amd64/arm64/armhf)
        working-directory: agent
        run: for a in amd64 arm64 armhf; do VERSION="${GITHUB_REF_NAME}" ARCH="$a" packaging/build-deb.sh; done
      - uses: actions/upload-artifact@v4
        with: { name: mymate-agent, path: agent/dist/*, if-no-files-found: error }

  agent-image:
    name: Build agent container image (RouterOS / docker)
    runs-on: ubuntu-24.04
    # Best-effort like the LXC: the binaries and .deb are the main agent artifacts, so a Docker
    # Hub hiccup pulling the Go base image shouldn't hold a release up.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One plain `docker save` style tarball per arch. RouterOS can't pull a multi-arch index
      # from a file, it wants a single-arch image tar for /container/add file=... so that's what
      # we ship. Nothing is pushed to a registry here, publishing is done by hand.
      - name: Build per-arch image tarballs
        run: |
          mkdir -p dist/agent-image
          for p in linux/amd64 linux/arm64 linux/arm/v7; do
            arch=$(echo "${p#linux/}" | tr -d /)   # amd64, arm64, armv7
            out="dist/agent-image/mymate-agent-image_${GITHUB_REF_NAME}_linux_${arch}.tar"
            docker buildx build agent \
              --platform "$p" \
              --build-arg VERSION="${GITHUB_REF_NAME}" \
              --provenance=false --sbom=false \
              --tag "mymate-agent:${GITHUB_REF_NAME}" \
              --output "type=docker,dest=${out}"
          done
          ( cd dist/agent-image && sha256sum ./*.tar > "mymate-agent-image_${GITHUB_REF_NAME}_SHA256SUMS" )
          ls -l dist/agent-image
      - uses: actions/upload-artifact@v4
        with: { name: mymate-agent-image, path: dist/agent-image/*, if-no-files-found: error }

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    # Wait for build-lxc too so its artifact is uploaded before we download it (otherwise
    # the release races ahead and the LXC template is missing). LXC stays optional: the `if`
    # only requires deb + agent, so a failed/skipped LXC still publishes the release.
    needs: [build-deb, agent, build-lxc, agent-image]
    if: always() && needs.build-deb.result == 'success' && needs.agent.result == 'success'
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with: { name: mymate-deb, path: dist }
      - name: Download LXC template (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: mymate-lxc, path: dist }
      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with: { name: mymate-agent, path: dist/agent }
      - name: Download agent container image tarballs (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: mymate-agent-image, path: dist/agent-image }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.zst
            dist/agent/*.tar.gz
            dist/agent/*.zip
            dist/agent/*.deb
            dist/agent/SHA256SUMS
            dist/agent-image/*.tar
            dist/agent-image/*_SHA256SUMS
          fail_on_unmatched_files: false
          generate_release_notes: true
