; My Mate - customer-facing DEMO processes (sales site on :8090).
;
; Runs the same app code with APP_ENV=demo (-> .env.demo: MYMATE_DEMO=true, mymate_demo
; DB, sync queue so broadcasts go inline - no Horizon needed). Two long-running procs:
;   - demo-reverb : the demo WebSocket server on :8081 (separate from prod's :8080)
;   - demo-sim    : the synthetic traffic simulator (drives the live map/charts)
;
; Install:
;   sudo cp deploy/supervisor/mymate-demo.conf /etc/supervisor/conf.d/mymate-demo.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
;
; Restart policy. autorestart=true alone is not enough: if a program dies within startsecs
; (default 1s) supervisor counts it as a failed start, and after startretries (default 3)
; it marks it FATAL and never tries again. That is how the simulator sat dead for five weeks
; after crashing on a missing table (GitHub #48). So every program here gets:
;   startsecs=10      must stay up 10s to count as started, so a fast crash loop backs off
;   startretries=1000 supervisor waits 1s, 2s, 3s ... longer after each failed start, so
;                     1000 tries keeps it retrying for days with at most ~17 min between
;                     attempts, long enough to ride out a broken deploy or a DB outage
; A program that runs past startsecs and then exits is just restarted, that path has no limit.

[program:mymate-demo-reverb]
process_name=%(program_name)s
command=php /opt/mymate/artisan reverb:start --host=0.0.0.0 --port=8081
directory=/opt/mymate
user=josh
environment=APP_ENV="demo"
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/opt/mymate/storage/logs/demo-reverb.log
stdout_logfile_maxbytes=20MB

[program:mymate-demo-sim]
process_name=%(program_name)s
; Runs the demo's migrations (guarded, idempotent, a no-op when nothing is pending) before the
; simulator starts, so a restart after a deploy can't leave mymate_demo behind the code. See
; deploy/demo/deploy.sh. If the migrate fails the sim doesn't start and supervisor retries.
command=/bin/bash -c "/opt/mymate/deploy/demo/deploy.sh --migrate-only && exec php /opt/mymate/artisan mymate:demo --run"
directory=/opt/mymate
user=josh
environment=APP_ENV="demo"
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/opt/mymate/storage/logs/demo-sim.log
stdout_logfile_maxbytes=20MB
