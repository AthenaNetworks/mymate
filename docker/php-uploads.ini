; My Mate (Docker) - PHP upload limits for the MikroTik "The Dude" importer.
; The base php:8.4-fpm image ships upload_max_filesize=2M / post_max_size=8M, which
; would reject any real dude.db. Match nginx client_max_body_size (4096m) and the
; app's mymate.import.max_upload_kb (4 GB default). post_max_size >= upload_max_filesize.
upload_max_filesize = 4096M
post_max_size = 4096M
memory_limit = 512M
