; My Mate - php-fpm pool. Runs the web tier as the `mymate` user, on the socket
; the shipped nginx site talks to. Installed to /etc/php/8.4/fpm/pool.d/mymate.conf.
[mymate]
user = mymate
group = mymate

listen = /run/php/php8.4-fpm-mymate.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Dude database uploads (POST /api/imports) run to tens/hundreds of MB.
php_admin_value[upload_max_filesize] = 1024M
php_admin_value[post_max_size] = 1024M
php_admin_value[memory_limit] = 512M

; fping lives in /usr/local/sbin - keep it on the pool's PATH for any web-invoked probe.
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/bin:/bin
