name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------- tests
  test:
    name: Backend tests + typecheck
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mymate
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mymate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mymate_test
      DB_USERNAME: mymate
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, snmp, mbstring, xml, curl, bcmath, gd, zip, intl, sodium
          tools: composer
          coverage: none

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test

  # ---------------------------------------------------------------- .deb
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, snmp, mbstring, xml, curl, bcmath, gd, zip, intl, sodium
          tools: composer

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build the .deb
        run: deploy/build/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymate-deb
          path: dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- agent
  agent:
    name: Agent - vet + cross-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Cross-compile every target (catches build breaks on all platforms)
        working-directory: agent
        env:
          CGO_ENABLED: '0'
        run: |
          for t in linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64; do
            echo "building $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done

  # ------------------------------------------------ agent <-> hub integration
  agent-integration:
    name: Agent - connect + reconnect (live hub)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mymate
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mymate
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mymate
      DB_USERNAME: mymate
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, snmp, mbstring, xml, curl, bcmath, gd, zip, intl, sodium
          tools: composer
      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Agent connect + reconnect-on-disconnect
        run: agent/test/integration.sh
