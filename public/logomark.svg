<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="My Mate logomark">
  <title>My Mate</title>
  <defs>
    <linearGradient id="mm-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0f14"/>
      <stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="mm-stroke" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="mm-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="mm-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glass tile -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="url(#mm-tile)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="url(#mm-glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.5" stroke="#ffffff" stroke-opacity="0.10"/>
  <!-- inner top highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- The "M" drawn as a network map: 4 links + 5 nodes -->
  <g filter="url(#mm-soft)">
    <polyline points="18,46 24,18 32,38 40,18 46,46"
      fill="none" stroke="url(#mm-stroke)" stroke-width="3.4"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nodes (vertices of the topology) -->
  <g>
    <circle cx="18" cy="46" r="3.4" fill="#34d399"/>
    <circle cx="24" cy="18" r="3.4" fill="#6ee7b7"/>
    <circle cx="32" cy="38" r="3.4" fill="#34d399"/>
    <circle cx="40" cy="18" r="3.4" fill="#6ee7b7"/>
    <circle cx="46" cy="46" r="3.4" fill="#34d399"/>
  </g>
  <g fill="#06170f">
    <circle cx="18" cy="46" r="1.3"/>
    <circle cx="24" cy="18" r="1.3"/>
    <circle cx="32" cy="38" r="1.3"/>
    <circle cx="40" cy="18" r="1.3"/>
    <circle cx="46" cy="46" r="1.3"/>
  </g>
</svg>
