# My Mate - nginx site (serves the React SPA + Laravel /api on port 80).
#
# Install:
#   sudo cp deploy/nginx/mymate.conf /etc/nginx/sites-available/mymate
#   sudo ln -sf /etc/nginx/sites-available/mymate /etc/nginx/sites-enabled/mymate
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires php8.4-fpm (the FPM pool listens on the socket below) and, for the
# live map, `php artisan reverb:start` on 127.0.0.1:8080 (proxied at /app).
# Build assets first: `npm run build`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/mymate/public;
    index index.php;

    charset utf-8;
    # Large enough for a Dude database upload (POST /api/imports) - dude.db files run
    # to tens/hundreds of MB. Keep this >= PHP upload_max_filesize/post_max_size and
    # the app's mymate.import.max_upload_kb (default 512 MB).
    client_max_body_size 4096m;

    # Reverb WebSocket (broadcasting). Browser connects to ws://<host>/app/...
    # To route live updates over port 80, build the frontend with
    # VITE_REVERB_HOST=<host> VITE_REVERB_PORT=80 VITE_REVERB_SCHEME=http.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Remote-agent WebSocket hub - probes connect to ws(s)://<host>/agent (Bearer token).
    # Requires `php artisan mymate:agent-hub` running on 127.0.0.1:9091 (see deploy/supervisor).
    location /agent {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        # Agents idle between polls - keep the pipe open well past the keepalive interval.
        proxy_read_timeout 3600s;
    }

    # Laravel front controller: everything that isn't a real file falls through
    # to index.php, which boots the SPA shell (web routes) and serves /api.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
    }

    # Long-cache Vite's fingerprinted build assets.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git, ...).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/mymate.error.log;
    access_log /var/log/nginx/mymate.access.log;
}
