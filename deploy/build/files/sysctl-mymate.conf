# My Mate - enable unprivileged ICMP "ping sockets" so the non-root service user can run
# fping for up/down monitoring without CAP_NET_RAW. This is the primary mechanism (works in
# containers, incl. unprivileged LXC); the package also sets CAP_NET_RAW as a fallback.
# Range covers all GIDs - enabling ICMP echo is not a privilege of concern (it is the default
# on Fedora/RHEL). Installed as /etc/sysctl.d/99-mymate.conf.
net.ipv4.ping_group_range = 0 2147483647
