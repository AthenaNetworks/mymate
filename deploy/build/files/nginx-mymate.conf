# My Mate - nginx site (serves the React SPA + Laravel /api on port 80).
# Installed to /etc/nginx/sites-available/mymate and symlinked into sites-enabled
# by the package. Talks to the dedicated `mymate` php-fpm pool + the local Reverb
# server. For HTTPS, run `certbot --nginx` (Recommends) and set SESSION_SECURE_COOKIE=true
# in /opt/mymate/.env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/mymate/public;
    index index.php;
    charset utf-8;

    # Large enough for a Dude database upload (tens/hundreds of MB). Keep >= the pool's
    # upload_max_filesize/post_max_size and the app's mymate.import.max_upload_kb.
    client_max_body_size 4096m;

    # Reverb WebSocket - the browser connects to ws(s)://<host>/app on the same origin.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Remote-agent WebSocket hub - probes connect to ws(s)://<host>/agent (Bearer token).
    # TLS is terminated here, so the agent link is encrypted the same as the web UI.
    location /agent {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        # Agents idle between polls - keep the pipe open well past the keepalive interval.
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm-mymate.sock;
        fastcgi_index index.php;
    }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git, ...).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/mymate.error.log;
    access_log /var/log/nginx/mymate.access.log;
}
