# My Mate, ready to run: the app plus its Postgres and Redis.
#
#   docker compose up -d
#   docker compose exec app php artisan mymate:user:create --admin
#   open https://localhost:9443    (self-signed cert, so your browser warns once)
#
# Ports: HTTPS is exposed on 9443 by default and listens on all interfaces. Override with
# MYMATE_HTTPS_PORT, or MYMATE_HTTP_PORT if you uncomment the HTTP mapping below.
#
# Before a real deployment: change APP_URL to the address you actually browse to. APP_KEY and
# REVERB_APP_SECRET are generated on first start and kept in the mymate-state volume (set them
# yourself to override). Keep the volumes: APP_KEY encrypts the stored device credentials, and
# the others hold your uploads, config backups and TLS certificate. If you'd rather terminate TLS
# at a reverse proxy or a Cloudflare Tunnel, expose the HTTP port instead - the app trusts
# X-Forwarded-Proto.

services:
  app:
    image: athenanetworks/mymate:latest
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # The URL you actually browse to. If you change the published port below, change this too.
      APP_URL: https://localhost:9443
      # Leave blank and one is generated on first start and kept in the mymate-state volume. It
      # encrypts the stored device credentials, so don't lose it (or that volume).
      APP_KEY: ${APP_KEY:-}
      DB_HOST: postgres
      DB_DATABASE: mymate
      DB_USERNAME: mymate
      DB_PASSWORD: mymate
      REDIS_HOST: redis
      # Leave blank to have one generated and kept in the mymate-state volume.
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      SANCTUM_STATEFUL_DOMAINS: localhost:9443,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://localhost:9443
    ports:
      # HTTPS on 9443 by default (self-signed cert). Change the host port with MYMATE_HTTPS_PORT.
      - "${MYMATE_HTTPS_PORT:-9443}:443"
      # Uncomment to also serve plain HTTP (e.g. behind a proxy that terminates TLS):
      # - "${MYMATE_HTTP_PORT:-9080}:80"
      # MikroTik CMR controller: devices in controller-managed mode connect here (TLS).
      - "${MYMATE_CMR_PORT:-54321}:54321"
    # fping needs raw ICMP. NET_RAW is in Docker's default set already; the sysctl covers
    # hosts that hand out unprivileged ping sockets instead.
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    volumes:
      - mymate-state:/var/lib/mymate          # generated APP_KEY + Reverb secret
      - mymate-storage:/app/storage/app       # uploaded images, map backgrounds, Dude imports
      - mymate-tls:/etc/mymate/tls            # the TLS certificate (self-signed, or mount your own)
      - rusted-config:/etc/rusted             # backup engine config + its API token
      - rusted-data:/var/lib/rusted           # config backups and their git history
      - cmr-data:/var/lib/mymate-cmr          # CMR controller identity (devices pin it) + registry
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mymate
      POSTGRES_PASSWORD: mymate
      POSTGRES_DB: mymate
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    # Transient broker only (queues, cache, broadcasting) - persistence off so it can't fill the
    # volume with an RDB dump or block writes on a failed save (GitHub #16), and a memory ceiling
    # so a runaway can't OOM the host; nothing here is durable, so allkeys-lru eviction is safe.
    # Raise MYMATE_REDIS_MAXMEMORY for very large fleets.
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--stop-writes-on-bgsave-error"
      - "no"
      - "--maxmemory"
      - "${MYMATE_REDIS_MAXMEMORY:-1gb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    restart: unless-stopped

volumes:
  pgdata:
  mymate-state:
  mymate-storage:
  mymate-tls:
  rusted-config:
  rusted-data:
  cmr-data:
