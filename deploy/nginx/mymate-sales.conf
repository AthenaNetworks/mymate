# My Mate - customer-facing sales DEMO on port 8090.
#
# Serves the SAME app code (/opt/mymate/public) as the production site on :80, but with
# APP_ENV=demo so Laravel loads .env.demo (MYMATE_DEMO=true, mymate_demo DB, its own
# Reverb on :8081). One shared build - demo behaviour is runtime-gated by the flag the
# blade injects, so nothing special is needed at build time.
#
# Requires: php8.4-fpm, `.env.demo`, `APP_ENV=demo php artisan reverb:start --port=8081`,
# and the synthetic simulator `APP_ENV=demo php artisan mymate:demo --run`.
#
# Install:
#   sudo cp deploy/nginx/mymate-sales.conf /etc/nginx/sites-available/mymate-sales
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /opt/mymate/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Reverb WebSocket for the DEMO instance (separate from prod's :8080).
    location /app {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Load .env.demo - this is what makes :8090 the demo instance.
        fastcgi_param APP_ENV demo;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
    }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/mymate-sales.error.log;
    access_log /var/log/nginx/mymate-sales.access.log;
}
