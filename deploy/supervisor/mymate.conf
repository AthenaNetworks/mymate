; My Mate - Supervisor process configuration.
;
; Copy to /etc/supervisor/conf.d/mymate.conf, edit paths/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; Processes:
;   - horizon    : queue workers (ping / poll / scan pools - sized in config/horizon.php)
;   - reverb     : the WebSocket server (live status + utilisation push)
;   - loop       : the poll-loop daemon (fping ~5s, throughput ~12s, discovery, history)
;   - scheduler  : runs due scheduled jobs (daily history-partition retention, P9)
;
; Scale-out (NFR-9): run `horizon` on as many worker hosts as you need (they share
; one Redis); raise MYMATE_POLL_SHARDS as the fleet grows. Run exactly ONE `loop`
; (it only dispatches; the per-shard/per-device locks make it safe, but one is cleanest).

[program:mymate-horizon]
process_name=%(program_name)s
command=php /opt/mymate/artisan horizon
directory=/opt/mymate
user=www-data
autostart=true
autorestart=true
; Horizon needs a clean SIGTERM to finish in-flight jobs before restart.
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/mymate/horizon.log
stdout_logfile_maxbytes=20MB

[program:mymate-reverb]
process_name=%(program_name)s
command=php /opt/mymate/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/opt/mymate
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/mymate/reverb.log
stdout_logfile_maxbytes=20MB

[program:mymate-agent-hub]
process_name=%(program_name)s
command=php /opt/mymate/artisan mymate:agent-hub --host=127.0.0.1 --port=9091
directory=/opt/mymate
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/mymate/agent-hub.log
stdout_logfile_maxbytes=20MB

[program:mymate-loop]
process_name=%(program_name)s
command=php /opt/mymate/artisan mymate:loop
directory=/opt/mymate
user=www-data
autostart=true
autorestart=true
; The loop is the engine heartbeat - restart fast if it ever dies.
startretries=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/mymate/loop.log
stdout_logfile_maxbytes=20MB

[program:mymate-scheduler]
process_name=%(program_name)s
command=php /opt/mymate/artisan schedule:work
directory=/opt/mymate
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/mymate/scheduler.log
stdout_logfile_maxbytes=20MB

[group:mymate]
programs=mymate-horizon,mymate-reverb,mymate-agent-hub,mymate-loop,mymate-scheduler
