; My Mate - PHP-FPM upload limits for the MikroTik "The Dude" importer.
;
; A dude.db export runs from tens of MB to several GB (mostly chart history). The
; app accepts up to 4 GB (config/mymate.php -> import.max_upload_kb = 4194304) and
; nginx allows 4096m (deploy/nginx/mymate.conf -> client_max_body_size), so PHP must
; match - otherwise PHP rejects the file with UPLOAD_ERR_INI_SIZE *before* Laravel
; runs and the upload fails with "The database failed to upload."
;
; Stock PHP ships upload_max_filesize=2M / post_max_size=8M, far too small.
; post_max_size must stay >= upload_max_filesize (multipart overhead + fields).
;
; Install: symlink/copy into /etc/php/8.4/fpm/conf.d/ then reload php8.4-fpm.

upload_max_filesize = 4096M
post_max_size = 4096M
